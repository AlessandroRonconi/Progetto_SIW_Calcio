<!DOCTYPE html>
<html>

<head>
    <title>Modifica commento</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>

    <h1>Modifica il commento</h1>
    <form th:action="@{'/games/' + ${gameId} + '/comments/' + ${comment.id} + '/edit'}" method="POST"
        th:object="${comment}">

        <input type="hidden" th:field="*{id}" />

        <div>
            text: <span><input required type="text" th:field="*{text}" /></span>
            <span th:if="${#fields.hasErrors('text')}" th:errors="*{text}" class="error-message"></span>
        </div>

        <span><button type="submit">Conferma</button></span>

    </form>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Tornei</title>
    <link rel="stylesheet" href="/css/stile.css">
</head>

<body>
    <h1 th:text="'Lista dei tornei (' + ${number} + ')'">Lista dei tornei (15)</h1>
    <div>
        <ul>
            <li th:each="tournament : ${tournaments}">
                <a th:href="@{'/tournaments/' + ${tournament.id}}" th:text="${tournament.name}">
            </li>
        </ul>
    </div>

    <h2>
        <div sec:authorize="hasAnyAuthority('ADMIN')">
            <a href="/admin/tournaments/new">Aggiungi un nuovo torneo</a>
        </div>
    </h2>
</body>

</html>

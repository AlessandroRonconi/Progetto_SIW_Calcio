<!DOCTYPE html>
<html>

<head>
    <title th:text="${tournament.name} + ' - Partecipanti'">Partecipanti</title>
    <link rel="stylesheet" href="/css/stile.css">
</head>

<body>
    <h3>
        <a href="/">Torna alla homepage</a>
    </h3>
    <h1 th:text="'Lista delle squadre che partecipano al torneo ' + ${tournament.name} + ' (' + ${number} + ')'">Lista
        dei partecipanti</h1>
    <div>
        <ul>
            <li th:each="team : ${participants}">
                <a th:href="@{'/teams/' + ${team.id}}" th:text="${team.name}">
            </li>
        </ul>
    </div>
</body>

</html>

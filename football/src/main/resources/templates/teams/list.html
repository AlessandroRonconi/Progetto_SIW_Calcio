<!DOCTYPE html>
<html>

<head>
    <title>Squadre</title>
    <link rel="stylesheet" href="/css/stile.css">
</head>

<body>
    <h3>
        <a href="/">Torna alla homepage</a>
    </h3>
    <h1 th:text="'Lista delle squadre (' + ${number} + ')'">Lista delle squadre (18)</h1>
    <div>
        <ul>
            <li th:each="team : ${teams}">
                <a th:href="@{'/teams/' + ${team.id}}" th:text="${team.name}">
            </li>
        </ul>
    </div>

    <h2>
        <div sec:authorize="hasAnyAuthority('ADMIN')">
            <a href="/admin/teams/new">Aggiungi una nuova squadra</a>
        </div>
    </h2>
</body>

</html>

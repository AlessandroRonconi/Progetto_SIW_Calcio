<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Form Giocatore</title>
    <link rel="stylesheet" href="/css/stile.css">
</head>

<body>

    <h1 th:text="${player.id} != null ? 'Modifica giocatore' : 'Nuovo giocatore'"></h1>
    <div class="error-banner" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

    <form th:action="${player.id} != null
        ? @{/admin/players/{id}/edit(id=${player.id})}
        : @{/admin/players/new}" th:object="${player}" method="post">

        <label for="firstName">Nome</label>
        <input type="text" id="firstName" th:field="*{firstName}" />
        <span class="error-message" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        <br />

        <label for="lastName">Cognome</label>
        <input type="text" id="lastName" th:field="*{lastName}" />
        <span class="error-message" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        <br />

        <label for="dateOfBirth">Data di nascita</label>
        <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" />
        <span class="error-message" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
        <br />

        <label for="role">Ruolo</label>
        <input type="text" id="role" th:field="*{role}" />
        <span class="error-message" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
        <br />

        <label for="height">Altezza (cm)</label>
        <input type="number" step="0.1" id="height" th:field="*{height}" />
        <span class="error-message" th:if="${#fields.hasErrors('height')}" th:errors="*{height}"></span>
        <br />

        <label for="squadra">Squadra</label>
        <select id="squadra" th:field="*{squadra}">
            <option value="">-- Svincolato --</option>
            <option th:each="squadra : ${squadre}" th:value="${squadra.id}" th:text="${squadra.name}"></option>
        </select>
        <br />

        <button type="submit">Salva</button>
    </form>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Giocatori</title>
    <link rel="stylesheet" href="/css/stile.css">
</head>
<body>
    <h1>Giocatori</h1>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/players/new}">Aggiungi giocatore</a>

    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Data di nascita</th>
            <th>Ruolo</th>
            <th>Altezza</th>
            <th>Squadra</th>
            <th sec:authorize="hasRole('ADMIN')">Azioni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="player : ${players}">
            <td th:text="${player.firstName}"></td>
            <td th:text="${player.lastName}"></td>
            <td th:text="${player.dateOfBirth}"></td>
            <td th:text="${player.role}"></td>
            <td th:text="${player.height} + ' cm'"></td>
            <td th:text="${player.squadra != null} ? ${player.squadra.name} : 'Svincolato'"></td>
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/players/{id}/edit(id=${player.id})}">Modifica</a>
                <form th:action="@{/admin/players/{id}/delete(id=${player.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn-cancella"
                        onclick="return confirm('Confermi eliminazione?')">Elimina</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
